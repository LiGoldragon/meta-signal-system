[package]
name = "meta-signal-system"
version = "4.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meta-signal-system"
description = "Meta signal contract for privileged system daemon configuration."
publish = false
build = "build.rs"

[lib]
name = "meta_signal_system"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-persona/datom", "signal/datom"]

[dependencies]
signal-persona = { git = "https://github.com/LiGoldragon/signal-persona.git", rev = "0f2b3e7ffb998c3e672306186cc796f2986fa367", default-features = false }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "7afb68b", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "ccacc214ba00b8448218d0b7559f037014694e41" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
